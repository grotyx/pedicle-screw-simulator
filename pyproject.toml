[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedicle-screw-simulator"
dynamic = ["version"]
requires-python = ">=3.12"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
# The app runs from source or via PyInstaller, not as an installed
# distribution; this keeps the metadata valid without claiming a
# distributable package layout.
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Structural: sys.path.insert() must run before these test-only imports so
# the test can locate the `src` package without an installed distribution.
"tests/test_totalseg_integration.py" = ["E402"]
# Structural: sys.path.insert() must run before these test-only imports so
# the test can locate the `src` package without an installed distribution.
"tests/test_ui_integration.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:vtkmodules.*"]
