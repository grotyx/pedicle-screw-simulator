[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedicle-screw-simulator"
dynamic = ["version"]
requires-python = ">=3.12"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
# The app runs from source or via PyInstaller, not as an installed
# distribution; this keeps the metadata valid without claiming a
# distributable package layout.
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

# Findings below live in files owned by other in-flight Phase 6 tasks (or in
# modules outside this task's editing scope) and were deliberately left
# in place rather than fixed here, to avoid colliding with concurrent edits.
# Each entry names the concrete rule(s) still failing; clear an entry only
# after fixing the underlying finding in that module.
[tool.ruff.lint.per-file-ignores]
# TODO(ruff): fix in main.py - unsorted imports
"main.py" = ["I001"]
# TODO(ruff): fix in scripts/build_desktop.py - unsorted imports
"scripts/build_desktop.py" = ["I001"]
