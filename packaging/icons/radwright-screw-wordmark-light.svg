    </g>
  </g>
  </g>
  <text xml:space="preserve" x="304" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="112" font-weight="600" fill="#0B1220">RadWright <tspan fill="#22D3EE">Screw</tspan></text>
