name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: PedicleScrewSimulator-Windows-x64
          - os: macos-15
            artifact: PedicleScrewSimulator-macOS-arm64
          - os: macos-15-intel
            artifact: PedicleScrewSimulator-macOS-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest tests -q

      - name: Build native desktop package
        run: python scripts/build_desktop.py

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v0.1.0
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0
