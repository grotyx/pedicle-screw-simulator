name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: PedicleScrewSimulator-Windows-x64
          - os: macos-15
            artifact: PedicleScrewSimulator-macOS-arm64
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt

      - name: Export application version
        shell: python
        run: |
          import os
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"APP_VERSION={version}\n")

      - name: Install build dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Windows CUDA build dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
          python -m pip install -r requirements-desktop.txt

      - name: Run automated tests
        run: |
          python -m ruff check src tests scripts main.py
          python -m pytest tests -q

      - name: Build native desktop package
        run: python scripts/build_desktop.py

      - name: Verify bundled AI runtime on macOS
        id: self_check_macos
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dist/PedicleScrewSimulator.app/Contents/MacOS/PedicleScrewSimulator --self-check

      - name: Print self-check log on failure (macOS)
        if: always() && steps.self_check_macos.outcome == 'failure'
        run: |
          log_path="$HOME/Library/Logs/PedicleScrewSimulator/self_check_error.log"
          if [ -f "$log_path" ]; then
            echo "--- self_check_error.log ---"
            cat "$log_path"
          else
            echo "No self-check log found at $log_path"
          fi

      - name: Verify bundled AI runtime on Windows
        id: self_check_windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PedicleScrewSimulator\PedicleScrewSimulator.exe -ArgumentList '--self-check' -Wait -PassThru
          exit $p.ExitCode

      - name: Print self-check log on failure (Windows)
        if: always() && steps.self_check_windows.outcome == 'failure'
        shell: pwsh
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA "PedicleScrewSimulator\logs\self_check_error.log"
          if (Test-Path $logPath) {
            Write-Host "--- self_check_error.log ---"
            Get-Content $logPath
          } else {
            Write-Host "No self-check log found at $logPath"
          }

      - name: Upload desktop package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-v${{ env.APP_VERSION }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0
