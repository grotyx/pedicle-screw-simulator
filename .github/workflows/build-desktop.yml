name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: PedicleScrewSimulator-Windows-x64
          - os: macos-15
            artifact: PedicleScrewSimulator-macOS-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt

      - name: Export application version
        shell: python
        run: |
          import os
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"APP_VERSION={version}\n")

      - name: Install build dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Windows CUDA build dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
          python -m pip install -r requirements-desktop.txt

      - name: Run automated tests
        run: python -m pytest tests -q

      - name: Build native desktop package
        run: python scripts/build_desktop.py

      - name: Verify bundled AI runtime on macOS
        if: runner.os == 'macOS'
        run: dist/PedicleScrewSimulator.app/Contents/MacOS/PedicleScrewSimulator --self-check

      - name: Verify bundled AI runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PedicleScrewSimulator\PedicleScrewSimulator.exe -ArgumentList '--self-check' -Wait -PassThru
          exit $p.ExitCode

      - name: Upload desktop package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-v${{ env.APP_VERSION }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0
